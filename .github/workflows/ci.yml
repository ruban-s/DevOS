name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # bun.lock is lockfileVersion 2, which bun 1.2 cannot parse. Runtime floor
      # for users stays bun >= 1.2; only the dev install needs this.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - run: bun install --frozen-lockfile

      - name: test
        run: bun test tests/

      - name: typecheck
        run: bun run typecheck
